name: End-to-End Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Playwright E2E Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Install Playwright browsers
        run: python -m playwright install chromium --with-deps

      - name: Start Astro dev server and run E2E tests
        env:
          # Firebase — safe to expose (protected by Firestore rules)
          PUBLIC_FIREBASE_API_KEY: "AIzaSyFakeKeyForTestingPurposes"
          PUBLIC_FIREBASE_AUTH_DOMAIN: "asenra-carousel-studio.firebaseapp.com"
          PUBLIC_FIREBASE_PROJECT_ID: "asenra-carousel-studio"
          PUBLIC_FIREBASE_STORAGE_BUCKET: "asenra-carousel-studio.appspot.com"
          PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "847507330171"
          PUBLIC_FIREBASE_APP_ID: "1:847507330171:web:fakeappid"
          # Server-side only — never prefix with PUBLIC_
          GEMINI_API_KEY: "AQ.FakeKeyForCITestingOnly"
        run: |
          # Launch Astro dev server in background
          npm run dev &

          # Wait up to 30s for port 4321 to become available
          npx wait-on http://localhost:4321 --timeout 30000

          # Execute the Playwright test suite
          python tests/test_basic.py

      - name: Upload test screenshots as CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/screenshots/
          retention-days: 7
